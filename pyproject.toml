[project]
name = "mezjeb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amanuel Getachew Gebrewold", email = "amanuelgetachew554@gmail.com" }
]
requires-python = ">=3.14"
dependencies = ["aiohttp", "tenacity", "structlog"]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "audit"}
]
lint = ["ruff", "ty"]
test = [
    "pytest",
    "pytest-asyncio>=1.4.0",
    "pytest-cov",
    "pytest-mock",
]
audit = ["pip-audit"]

[project.scripts]
mezjeb = "mezjeb:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001"]

[tool.ty]
[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.pytest]
addopts = ["--cov=mezjeb", "--cov-fail-under=80"]
